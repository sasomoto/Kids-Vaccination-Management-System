<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Vaccine Inventory</h1>
        <table class="inventory-table">
            <thead>
                <tr>
                    <th>Inventory ID</th>
                    <th>Inventory Name</th>
                    <th>Contact</th>
                    <th>Quantity Remaining</th>
                    <th>Hospital ID</th>
                </tr>
            </thead>
            <tbody>
                {% for item in inventory %}
                <tr>
                    <td>{{ item.InvID }}</td>
                    <td>{{ item.Inv_Name }}</td>
                    <td>{{ item.Inv_Contact }}</td>
                    <td>{{ item.QuantityRemaining }}</td>
                    <td>{{ item.HospitalID }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/adjust-inventory" class="btn-submit">Adjust Inventory</a>
    </div>
</body>
</html>
