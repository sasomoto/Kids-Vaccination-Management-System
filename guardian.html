<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardians List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Guardians List</h1>
        <table class="guardians-table">
            <thead>
                <tr>
                    <th>Guardian ID</th>
                    <th>Name</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody>
                {% for guardian in guardians %}
                <tr>
                    <td>{{ guardian.GuardianID }}</td>
                    <td>{{ guardian.GuardianName }}</td>
                    <td>{{ guardian.GuardianContact }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="/add-guardian" class="btn-submit">Add New Guardian</a>
    </div>
</body>
</html>
