<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjust Vaccine Inventory</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Adjust Vaccine Inventory</h1>
        <form action="/adjust-inventory" method="POST" class="adjust-inventory-form">
            <div class="form-group">
                <label for="vaccine_id">Vaccine:</label>
                <select id="vaccine_id" name="vaccine_id" required>
                    {% for vaccine in vaccines %}
                    <option value="{{ vaccine.VaccineID }}">{{ vaccine.VaccineName }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="quantity_to_add">Quantity to be Added:</label>
                <input type="number" id="quantity_to_add" name="quantity_to_add" required>
            </div>
            <button type="submit" class="btn-submit">Update Inventory</button>
        </form>
        <a href="/inventory" class="btn-back">Back to Inventory List</a>
    </div>
</body>
</html>
